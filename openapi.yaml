openapi: "3.0.3"

info:
  title: flickies
  version: "0.4.0"
  description: |
    Self-hosted video REST + MCP API. Lipsync (Wav2Lip + LatentSync 1.5),
    face restoration (GFPGAN), ffmpeg-driven video ops, async jobs, webhooks.

    The MCP endpoint at /v1/mcp is JSON-RPC over a streamable HTTP
    transport and is NOT described in this document — use an MCP client.

    ## License posture

    Wav2Lip variants are trained on LRS2 (non-commercial). The server refuses
    to load them unless `FLICKIES_ENABLE_NONCOMMERCIAL=1`. LatentSync 1.5
    (Apache-2.0) is the commercial-safe default.

    ## API contract

    Every video endpoint takes a JSON body. Nothing is multipart:
    `PUT /v1/files/{path}`, the local-staging interface, takes the raw file
    bytes as the request body.

    **Input** — exactly one of:
      - `file_path` (FILES_DIR-relative, server reads from local /v1/files
        staging area)
      - `file_url` (any HTTP/HTTPS URL the server fetches)

    **Output** — exactly one of:
      - `output_path` (server writes to FILES_DIR/<path>, response JSON is
        `{path, size, ...}`; caller downloads via `GET /v1/files/<path>`)
      - `output_url` (server PUTs to the URL — presigned PUT or
        PUT-accepting endpoint; response JSON is `{url, size, ...}`)

    With `async_job=true` the result always goes to `jobs/<uuid>.<ext>`
    under FILES_DIR and `output_path` / `output_url` are ignored. The file
    name is not the job id: read it from `result.path` on
    `GET /v1/jobs/{job_id}`.

    ## Auth

    When the server has `FLICKIES_AUTH_TOKEN` set, every route in this
    document, `/v1/health` included, needs `Authorization: Bearer <token>`.
    Only the unversioned liveness probe `GET /healthz` (not described here)
    is exempt.

servers:
  - url: http://localhost:8000

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Liveness probe + discovery.
  - name: Engines
    description: List, inspect, evict registered engines. One model resident at a time on the GPU — see hot-swap eviction in /v1/engines.
  - name: Files
    description: Local staging area — upload, download, delete files referenced by other endpoints.
  - name: Jobs
    description: Async-job queue — poll long-running operations.
  - name: Lipsync
    description: Drive a face video/image from an audio track.
  - name: Restore
    description: Face restoration via GFPGAN — clean up Wav2Lip output or old footage.
  - name: Video Transform
    description: Pure-ffmpeg video ops — trim, concat, transcode (incl. gif + fps + codec), scale, mux audio, extract audio, thumbnail grid.
  - name: Info
    description: ffprobe metadata.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    EngineSlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
      description: Engine slug. Engines are ML-only (`wav2lip`, `wav2lip-gan`, `latentsync-1.5`, `gfpgan`); ffmpeg is the standard CPU backend and isn't an engine.
    FilesPath:
      in: path
      name: path
      required: true
      schema:
        type: string
      description: FILES_DIR-relative path (slashes allowed).
    JobIdPath:
      in: path
      name: job_id
      required: true
      schema:
        type: string
      description: UUID of an async job.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
      description: |
        Optional opaque token for safe POST retries. Server replays the cached
        response for any subsequent POST with the same (key, method, path)
        within the LRU window. RFC 9580 (Idempotency-Key header).
    XRequestIdReq:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
      description: |
        Optional correlator. If not provided, the server generates a UUID4
        and echoes it back on the `X-Request-Id` response header. Threaded
        through every log line via ContextVar.

  headers:
    XRequestIdHeader:
      schema: { type: string }
      description: Server-generated or client-echoed request correlator. Always present on every response.

  responses:
    "400":
      description: Bad request — invalid input or constraint violation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "401":
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "403":
      description: Non-commercial opt-in gate refused (FLICKIES_ENABLE_NONCOMMERCIAL not set).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "404":
      description: Engine or file not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "413":
      description: Payload too large.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "422":
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

    EngineBusy:
      description: A video engine is processing a request or being unloaded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    UnloadResult:
      type: object
      required: [unloaded]
      properties:
        unloaded:
          type: array
          description: Slugs of the engines released by this request.
          items: { type: string }
    # ── error envelope ─────────────────────────────────────────────────────
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable UPPER_SNAKE_CASE error code.
          examples: [BAD_REQUEST, UNAUTHORIZED, NOT_FOUND, NONCOMMERCIAL_GATE_REFUSED, ENGINE_BUSY, VALIDATION_FAILED, INTERNAL_SERVER_ERROR]
        message:
          type: string
          description: Human-readable error description.
        details:
          type: object
          additionalProperties: true
          description: Optional structured detail bag — field-by-field validation errors, upstream provider IDs, etc.

    # ── discovery ──────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status, version, device, available_engines, noncommercial_enabled]
      properties:
        status: { type: string, examples: [ok], description: "Current state returned by the service." }
        version: { type: string, description: "Flickies version running on the server." }
        device: { type: string, description: "auto / cpu / cuda" }
        available_engines:
          description: "Engine slugs registered with the server."
          type: array
          items: { type: string }
        enabled_engines:
          description: "Engine slugs enabled by this deployment."
          type: array
          items: { type: string }
        loaded_engine:
          type: string
          nullable: true
          description: Currently resident engine slug, or null if none loaded.
        noncommercial_enabled:
          description: "Whether this deployment allows engines that require non-commercial opt-in."
          type: boolean

    EngineInfo:
      type: object
      required: [slug, executor, loaded, noncommercial]
      properties:
        slug: { type: string, description: "Engine ID to use in API requests." }
        executor: { type: string, description: "Backend implementation for this engine." }
        variant: { type: string, nullable: true, description: "Model variant, when the backend provides one." }
        loaded: { type: boolean, description: "Whether the engine is currently loaded into memory." }
        noncommercial: { type: boolean, description: "Whether using the engine requires non-commercial opt-in." }
        cuda_only: { type: boolean, description: "Whether the engine requires an NVIDIA GPU." }
        vram_gb_min: { type: number, nullable: true, description: "Estimated minimum GPU memory in gigabytes." }
        description: { type: string, description: "Purpose of this configured engine." }
        last_used_secs_ago:
          type: number
          nullable: true
          description: Seconds since this engine last served a request; null if never used.

    EngineList:
      type: object
      required: [engines]
      properties:
        engines:
          description: "Registered engines and their current load state."
          type: array
          items: { $ref: "#/components/schemas/EngineInfo" }

    # ── jobs / files / async ───────────────────────────────────────────────
    JobAcceptedResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid, description: "ID of an asynchronous job. Use it to poll for the result." }
        status: { type: string, examples: [accepted], description: "Accepted indicates that the job has been queued." }

    JobStatusResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid, description: "ID of an asynchronous job. Use it to poll for the result." }
        status:
          description: "Current job state. Poll again while the status is pending or running."
          type: string
          enum: [pending, running, complete, failed, cancelled]
        result:
          description: "Output metadata once the job finishes successfully."
          type: object
          nullable: true
          additionalProperties: true
        error:
          description: "Failure details when the job fails."
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }

    StagedOutputResponse:
      type: object
      required: [path, size]
      properties:
        path: { type: string, description: "Relative staging path to the output file." }
        size: { type: integer, description: "Size of the output in bytes." }
        sha256: { type: string, nullable: true, description: "SHA-256 checksum of the output bytes." }
        duration_sec: { type: number, nullable: true, description: "Duration in seconds." }
        width: { type: integer, nullable: true, description: "Width in pixels." }
        height: { type: integer, nullable: true, description: "Height in pixels." }

    UrlOutputResponse:
      type: object
      required: [url, size]
      properties:
        url: { type: string, format: uri, description: "Destination URL used to write the output." }
        size: { type: integer, description: "Size of the output in bytes." }
        sha256: { type: string, nullable: true, description: "SHA-256 checksum of the output bytes." }

    # ── reusable input/output base ─────────────────────────────────────────
    BaseVideoInputRequest:
      type: object
      description: Exactly one of file_path / file_url MUST be provided. Enforced at handler boundary.
      properties:
        file_path:
          type: string
          nullable: true
          description: FILES_DIR-relative path of an already-uploaded video.
        file_url:
          type: string
          nullable: true
          format: uri
          description: HTTP(S) URL the server fetches.

    BaseVideoOutputRequest:
      type: object
      description: Exactly one of output_path / output_url required in sync mode; both optional in async mode (auto-staged).
      properties:
        output_path: { type: string, nullable: true, description: "Relative staging path where the server should write the result." }
        output_url: { type: string, nullable: true, format: uri, description: "HTTP(S) URL that accepts a PUT of the result." }
        async_job: { type: boolean, default: false, description: "Schedule work in the background and return a job ID. Use the job result's path to retrieve the output." }
        webhook_url: { type: string, nullable: true, format: uri, description: "Notify URL on async completion (HMAC-signed)." }
        output_format:
          description: "Container format for the output video."
          type: string
          enum: [mp4, webm, mov, mkv]
          default: mp4

    # ── lipsync ────────────────────────────────────────────────────────────
    VideoLipsyncRequest:
      allOf:
        - $ref: "#/components/schemas/BaseVideoOutputRequest"
      type: object
      description: |
        Exactly one of face_path / face_url required (driving face).
        Exactly one of audio_path / audio_url required (driving audio).
      properties:
        face_path:
          type: string
          nullable: true
          description: FILES_DIR-relative face video or still image.
        face_url:
          description: "HTTP(S) URL of the face video or image. Omit when using face_path."
          type: string
          nullable: true
          format: uri
        audio_path:
          type: string
          nullable: true
          description: FILES_DIR-relative path of the driving audio (wav/mp3/m4a).
        audio_url:
          type: string
          nullable: true
          format: uri
          description: http(s) URL of the driving audio.
        engine:
          type: string
          enum: [wav2lip, wav2lip-gan, latentsync-1.5]
          default: latentsync-1.5
          description: |
            wav2lip / wav2lip-gan require FLICKIES_ENABLE_NONCOMMERCIAL=1
            (LRS2 training data is non-commercial). latentsync-1.5 is the
            commercial-safe default on CUDA.
        restore_face:
          type: boolean
          default: false
          description: Chain GFPGAN over the output to clean up the face region (recommended after wav2lip*).

    # ── restore ────────────────────────────────────────────────────────────
    VideoRestoreRequest:
      allOf:
        - $ref: "#/components/schemas/BaseVideoInputRequest"
        - $ref: "#/components/schemas/BaseVideoOutputRequest"
      type: object
      properties:
        engine:
          description: "Engine slug for the face restoration model."
          type: string
          enum: [gfpgan]
          default: gfpgan

    # ── ffmpeg ops ─────────────────────────────────────────────────────────
    VideoTrimRequest:
      allOf:
        - $ref: "#/components/schemas/BaseVideoInputRequest"
        - $ref: "#/components/schemas/BaseVideoOutputRequest"
      type: object
      required: [start_sec, end_sec]
      properties:
        start_sec: { type: number, minimum: 0, description: "Start time in seconds from the start of the source." }
        end_sec: { type: number, minimum: 0, description: "End time in seconds from the start of the source." }
        precise:
          type: boolean
          default: false
          description: |
            When false (default), trim uses `-c copy` for speed — fast, but
            ffmpeg can only cut on keyframe boundaries, so `start_sec` snaps
            to the nearest keyframe and may eat up to one GOP (~seconds) of
            leading content. When true, trim re-encodes with H.264 + AAC for
            frame-accurate boundaries (slower; single-generation, visually
            transparent).

    VideoConcatRequest:
      type: object
      description: Concatenate ≥2 videos in order. Exactly one of inputs_paths / inputs_urls must be provided.
      properties:
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        inputs_paths:
          description: "Relative staging paths for clips in playback order."
          type: array
          nullable: true
          items: { type: string }
          minItems: 2
        inputs_urls:
          description: "HTTP(S) URLs for clips in playback order."
          type: array
          nullable: true
          items: { type: string, format: uri }
          minItems: 2
        transitions: {type: array, nullable: true, maxItems: 15, items: {$ref: "#/components/schemas/VideoTransition"}, description: "One transition per join. Omit for the original concat behavior."}
        precise:
          type: boolean
          default: false
          description: |
            When false (default), concat uses the concat demuxer with
            `-c copy` — fast, but requires all inputs to share identical
            codec / timebase / SAR (mixing different encoders corrupts or
            fails). When true, the concat demuxer re-encodes with uniform
            H.264 + AAC so mixed inputs join cleanly (slower; single-
            generation re-encode).

    VideoTranscodeRequest:
      type: object
      description: |
        Universal re-encode. `output_format` in BaseVideoOutputRequest drives
        the filter graph (`mp4` / `webm` / `mov` / `mkv` → standard transcode;
        `gif` → palette-aware two-pass). `fps`, codec, crf, preset all apply
        to the re-encode; gif-specific options live under `gif_options`.
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        output_format: {type: string, enum: [mp4, webm, mov, mkv, gif], default: mp4, description: "Container format for the output video." }
        max_size_bytes: {type: integer, nullable: true, minimum: 65536, description: "MP4 size ceiling in bytes. Uses H.264/AAC and cannot be combined with CRF."}
        video_codec: { type: string, nullable: true, examples: [libx264, libx265, libvpx-vp9, libaom-av1], description: "Video codec to write, when the chosen container supports it." }
        audio_codec: { type: string, nullable: true, examples: [aac, libopus, copy], description: "Audio codec to write, when the chosen container supports it." }
        crf: { type: integer, nullable: true, minimum: 0, maximum: 51, description: "Constant rate factor controlling quality. With compatible codecs, lower values preserve more detail." }
        preset: { type: string, nullable: true, examples: [ultrafast, fast, medium, slow], description: "Encoding speed preset for a compatible encoder." }
        fps: { type: number, nullable: true, minimum: 1, maximum: 240, description: "Re-encode at this frame rate. Applies to all output formats." }
        gif_options:
          type: object
          nullable: true
          description: Only consulted when output_format=gif.
          properties:
            width: { type: integer, nullable: true }
            loop: { type: integer, default: 0, description: "0 = infinite" }
            palette_mode:
              type: string
              enum: [full, diff, single]
              default: full

    VideoScaleRequest:
      allOf:
        - $ref: "#/components/schemas/BaseVideoInputRequest"
        - $ref: "#/components/schemas/BaseVideoOutputRequest"
      type: object
      required: [width, height]
      properties:
        width: { type: integer, minimum: 16, description: "Width in pixels." }
        height: { type: integer, minimum: 16, description: "Height in pixels." }
        keep_aspect:
          type: boolean
          default: true
          description: If true, pad/crop to maintain source aspect.

    VideoMuxAudioRequest:
      allOf:
        - $ref: "#/components/schemas/BaseVideoOutputRequest"
      type: object
      required: [video_path_or_url, audio_path_or_url]
      properties:
        video_path_or_url: { type: string, description: "Staged path or HTTP(S) URL of the video clip." }
        audio_path_or_url: { type: string, description: "Staged path or HTTP(S) URL of the audio track." }
        replace_existing_audio:
          description: "Replace the input video's existing audio instead of keeping it."
          type: boolean
          default: true

    VideoExtractAudioRequest:
      allOf:
        - $ref: "#/components/schemas/BaseVideoInputRequest"
      type: object
      properties:
        audio_format:
          description: "Encoding for the extracted audio file."
          type: string
          enum: [wav, mp3, m4a, ogg, flac]
          default: wav
        output_path: { type: string, nullable: true, description: "Relative staging path where the server should write the result." }
        output_url: { type: string, nullable: true, format: uri, description: "HTTP(S) URL that accepts a PUT of the result." }

    VideoThumbnailGridRequest:
      type: object
      required: [rows, cols]
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        timestamps: {type: boolean, default: false, description: "Source offsets in seconds for selected thumbnails." }
        layout: {type: string, enum: [tight, review], default: tight, description: "How thumbnails are arranged in the output image." }
        rows: { type: integer, minimum: 1, maximum: 16, description: "Number of rows in the thumbnail grid." }
        cols: { type: integer, minimum: 1, maximum: 16, description: "Number of columns in the thumbnail grid." }
        cell_width: { type: integer, default: 320, description: "Width in pixels of each thumbnail in the grid." }
        cell_height: { type: integer, default: 180, description: "Height in pixels of each thumbnail in the grid." }

    TimedWord:
      type: object
      required: [text, start_sec, end_sec]
      properties:
        text: {type: string, minLength: 1, maxLength: 128, description: "Word or token spoken during this time interval." }
        start_sec: {type: number, minimum: 0, maximum: 86400, description: "Start time in seconds from the start of the source." }
        end_sec: {type: number, minimum: 0, maximum: 86400, description: "End time in seconds from the start of the source." }

    VideoTransition:
      type: object
      required: [effect, duration_sec]
      properties:
        effect: {type: string, enum: [cut, fade, wipeleft, wiperight, slideleft, slideright, dissolve], description: "Transition used between adjacent input clips." }
        duration_sec: {type: number, minimum: 0, maximum: 10, description: "Duration in seconds." }

    VideoSubtitlesRequest:
      type: object
      description: "Burn in an SRT or ASS file, embed a selectable track, or build karaoke captions from word timestamps."
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        subtitle_path: {type: string, nullable: true, description: "Staged SRT or ASS path. Supply exactly one of subtitle_path and words."}
        words: {type: array, nullable: true, minItems: 1, maxItems: 12000, items: {$ref: "#/components/schemas/TimedWord"}, description: "Words and timestamps used to generate karaoke captions." }
        mode: {type: string, enum: [burn, embed], default: burn, description: "Burn captions into the image or embed them as a selectable subtitle track." }
        words_per_line: {type: integer, minimum: 1, maximum: 12, default: 4, description: "Maximum number of words grouped into each karaoke line." }
        font_size: {type: integer, minimum: 12, maximum: 140, default: 56, description: "Font size for generated karaoke captions." }

    VideoOverlayRequest:
      type: object
      description: "Draw a staged image (PNG, JPEG or WebP) or a text label during the specified interval."
      required: [end_sec]
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        image_path: {type: string, nullable: true, description: "Staged image path. Supply exactly one of image_path and text."}
        text: {type: string, nullable: true, maxLength: 160, description: "Text to render into the video." }
        start_sec: {type: number, minimum: 0, maximum: 86400, default: 0, description: "Start time in seconds from the start of the source." }
        end_sec: {type: number, minimum: 0, maximum: 86400, description: "End time in seconds from the start of the source." }
        x: {type: integer, minimum: 0, maximum: 16384, default: 24, description: "Horizontal pixel offset measured from the left edge." }
        y: {type: integer, minimum: 0, maximum: 16384, default: 24, description: "Vertical pixel offset measured from the top edge." }

    VideoCropRequest:
      type: object
      description: "Crop to a rectangle or fit to a canvas with center crop, letterbox padding or a blurred background."
      required: [width, height]
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        width: {type: integer, minimum: 16, maximum: 4096, multipleOf: 2, description: "Width in pixels." }
        height: {type: integer, minimum: 16, maximum: 4096, multipleOf: 2, description: "Height in pixels." }
        mode: {type: string, enum: [crop, pad, blur], default: crop, description: "Crop to fill, pad with letterboxing, or fill unused space with a blurred background." }
        x: {type: integer, nullable: true, minimum: 0, maximum: 16384, description: "Left edge of an explicit crop, in pixels." }
        y: {type: integer, nullable: true, minimum: 0, maximum: 16384, description: "Top edge of an explicit crop, in pixels." }

    VideoComposeRequest:
      type: object
      description: "Combine two clips side by side, stacked or picture-in-picture."
      required: [second_path]
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        second_path: {type: string, description: "Staged path of the second video."}
        layout: {type: string, enum: [horizontal, vertical, pip], default: horizontal, description: "Arrangement of the input clips." }
        width: {type: integer, minimum: 16, maximum: 4096, multipleOf: 8, default: 1280, description: "Width in pixels." }
        height: {type: integer, minimum: 16, maximum: 4096, multipleOf: 8, default: 720, description: "Height in pixels." }
        audio: {type: string, enum: [first, second, none], default: first, description: "Choose the first clip's audio, the second clip's audio, or silence." }

    VideoScenesRequest:
      type: object
      description: "Detect scene cuts and write a JSON manifest or a ZIP with the manifest and preview frames or trimmed clips."
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        threshold: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 100, default: 10, description: "Minimum change score used to identify a scene cut. Higher values detect fewer cuts." }
        artifacts: {type: string, enum: [none, frames, clips], default: none, description: "Choose manifest only, preview frames, or trimmed scene clips." }
        max_scenes: {type: integer, minimum: 1, maximum: 200, default: 50, description: "Maximum number of scenes to include." }

    VideoAnalyzeRequest:
      type: object
      description: "Report black frames, frozen video and silent intervals in a JSON file."
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        black_min_sec: {type: number, minimum: 0.05, maximum: 60, default: 0.25, description: "Shortest black interval to report, in seconds." }
        freeze_min_sec: {type: number, minimum: 0.05, maximum: 60, default: 0.5, description: "Shortest frozen interval to report, in seconds." }
        silence_min_sec: {type: number, minimum: 0.05, maximum: 60, default: 0.5, description: "Shortest quiet interval to report, in seconds." }
        silence_db: {type: number, minimum: -90, maximum: -5, default: -40, description: "Audio level in decibels below which a signal is considered silent." }

    VideoFramesRequest:
      type: object
      description: "Extract timestamped JPEG samples into a ZIP with a frames.json manifest."
      properties:
        file_path: {type: string, nullable: true, description: "Staged input path. Provide exactly one input."}
        file_url: {type: string, format: uri, nullable: true, description: "HTTP(S) input URL."}
        output_path: {type: string, nullable: true, description: "Staged output path in synchronous mode."}
        output_url: {type: string, format: uri, nullable: true, description: "Presigned PUT URL in synchronous mode."}
        async_job: {type: boolean, default: false, description: "Schedule the job and stage the result under jobs/."}
        webhook_url: {type: string, format: uri, nullable: true, description: "Callback URL for asynchronous completion."}
        sample_interval_sec: {type: number, minimum: 0.1, maximum: 60, default: 1, description: "Time between sampled frames, in seconds." }
        max_frames: {type: integer, minimum: 1, maximum: 120, default: 60, description: "Maximum number of frames to sample." }

    VideoInfoRequest:
      allOf:
        - $ref: "#/components/schemas/BaseVideoInputRequest"
      type: object

    VideoInfoResponse:
      type: object
      properties:
        duration_sec: { type: number, description: "Duration in seconds." }
        width: { type: integer, description: "Width in pixels." }
        height: { type: integer, description: "Height in pixels." }
        fps: { type: number, description: "Video frames per second." }
        video_codec: { type: string, description: "Video codec detected in the input." }
        audio_codec: { type: string, nullable: true, description: "Audio codec detected in the input, or null for a silent video." }
        bitrate: { type: integer, nullable: true, description: "Overall stream bitrate in bits per second, when known." }
        container_format: { type: string, nullable: true, description: "Container names reported by the probe." }
        size_bytes: { type: integer, description: "Input file size in bytes." }

paths:
  /v1/health:
    get:
      tags: [Health]
      summary: "Check service health"
      operationId: getHealth
      description: "Check whether the service is responding and see which device and engines are available. This versioned route requires a bearer token when authentication is enabled."
      responses:
        "200":
          description: Server status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /v1/engines:
    get:
      tags: [Engines]
      summary: "List video engines"
      operationId: listEngines
      description: "See which inference engines are registered, which are loaded and what hardware or license settings each needs."
      responses:
        "200":
          description: Engine list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineList" }
        "401": { $ref: "#/components/responses/401" }

  /v1/unload:
    post:
      tags: [Engines]
      summary: "Unload all video engines"
      operationId: unloadAllEngines
      description: "Stop resident inference workers and return the released engine slugs. Workers start again on demand."
      responses:
        "200":
          description: Released engines. The list is empty when nothing was loaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnloadResult" }
        "401": { $ref: "#/components/responses/401" }
        "409": { $ref: "#/components/responses/EngineBusy" }

  /v1/engines/{slug}:
    delete:
      tags: [Engines]
      summary: "Unload a video engine"
      operationId: evictEngine
      description: "Release the selected inference engine from memory. The next request that needs it can load it again."
      parameters:
        - $ref: "#/components/parameters/EngineSlug"
      responses:
        "204":
          description: Evicted.
        "409": { $ref: "#/components/responses/EngineBusy" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }

  /v1/files/{path}:
    put:
      tags: [Files]
      summary: "Upload a staged file"
      operationId: putFile
      description: "Send the file as raw bytes and put its relative staging path in the URL. Use that path in later video requests."
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagedOutputResponse" }
        "401": { $ref: "#/components/responses/401" }
        "413": { $ref: "#/components/responses/413" }
    get:
      tags: [Files]
      summary: "Download a staged file"
      operationId: getFile
      description: "Return the bytes at the given path. Use this to retrieve uploaded inputs or staged results."
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      responses:
        "200":
          description: File stream.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
    delete:
      tags: [Files]
      summary: "Delete a staged file"
      operationId: deleteFile
      description: "Remove the file at the specified staging path."
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }

  /v1/jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: "Get a background job"
      operationId: getJob
      description: "Poll the job ID from a 202 response. On success, the result provides the staged output path to download."
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      responses:
        "200":
          description: Job status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatusResponse" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }

  /v1/video/lipsync:
    post:
      tags: [Lipsync]
      summary: "Lip-sync a face"
      operationId: postVideoLipsync
      description: "Animate the face in a source video or still image using a separate audio track. Use an engine that supports the source type and the deployment's hardware."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoLipsyncRequest" }
            example:
              face_path: "uploads/face.mp4"
              audio_path: "uploads/voice.wav"
              engine: "latentsync-1.5"
              output_path: "out/lipsync.mp4"
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Async accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/restore:
    post:
      tags: [Restore]
      summary: "Restore faces in video"
      operationId: postVideoRestore
      description: "Use GFPGAN to clean up the face region in a clip. This can also be run on the result of lip-sync."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoRestoreRequest" }
            example:
              file_path: "uploads/clip.mp4"
              output_path: "out/restored.mp4"
      responses:
        "200":
          description: Sync result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Async accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/trim:
    post:
      tags: [Video Transform]
      summary: "Trim a video clip"
      operationId: postVideoTrim
      description: "Keep the interval between the supplied offsets in seconds. Enable precise trimming to re-encode at the requested frame boundaries."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoTrimRequest" }
            example:
              file_path: "uploads/clip.mp4"
              start_sec: 1
              end_sec: 4
              precise: true
              output_path: "out/trimmed.mp4"
      responses:
        "200":
          description: Trimmed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400": { $ref: "#/components/responses/400" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/concat:
    post:
      tags: [Video Transform]
      summary: "Concatenate video clips"
      operationId: postVideoConcat
      description: "Join two or more clips in the supplied order. You can add transitions between clips."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoConcatRequest" }
            example:
              inputs_paths: ["uploads/first.mp4", "uploads/second.mp4"]
              output_path: "out/joined.mp4"
      responses:
        "200":
          description: Concatenated.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }

  /v1/video/transcode:
    post:
      tags: [Video Transform]
      summary: "Transcode a video"
      operationId: postVideoTranscode
      description: "Re-encode into another container or codec, change the frame rate, or produce an animated GIF."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoTranscodeRequest" }
            example:
              file_path: "uploads/clip.mp4"
              output_format: "webm"
              output_path: "out/clip.webm"
      responses:
        "200":
          description: Transcoded.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }

  /v1/video/scale:
    post:
      tags: [Video Transform]
      summary: "Resize a video"
      operationId: postVideoScale
      description: "Set the output width and height in pixels. Use the aspect-ratio option to avoid stretching the image."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoScaleRequest" }
            example:
              file_path: "uploads/clip.mp4"
              width: 1280
              height: 720
              output_path: "out/scaled.mp4"
      responses:
        "200":
          description: Scaled.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"

  /v1/video/mux_audio:
    post:
      tags: [Video Transform]
      summary: "Add audio to a video"
      operationId: postVideoMuxAudio
      description: "Combine a video and an audio track. Set the replacement option to discard an existing audio track."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoMuxAudioRequest" }
            example:
              video_path_or_url: "uploads/clip.mp4"
              audio_path_or_url: "uploads/voice.wav"
              replace_existing_audio: true
              output_path: "out/with-voice.mp4"
      responses:
        "200":
          description: Muxed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"

  /v1/video/extract_audio:
    post:
      tags: [Video Transform]
      summary: "Extract audio from a video"
      operationId: postVideoExtractAudio
      description: "Save the clip's audio track as a separate file in the selected audio format."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoExtractAudioRequest" }
            example:
              file_path: "uploads/clip.mp4"
              audio_format: "wav"
              output_path: "out/clip.wav"
      responses:
        "200":
          description: Audio extracted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"

  /v1/video/thumbnail_grid:
    post:
      tags: [Video Transform]
      summary: "Create a thumbnail grid"
      operationId: postVideoThumbnailGrid
      description: "Arrange sampled frames in rows and columns. Supply timestamps to pick particular moments."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoThumbnailGridRequest" }
            example:
              file_path: "uploads/clip.mp4"
              rows: 2
              cols: 3
              output_path: "out/grid.png"
      responses:
        "200":
          description: PNG grid produced.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }

  /v1/video/subtitles:
    post:
      tags: [Video Transform]
      summary: "Add subtitles or karaoke captions"
      operationId: postVideoSubtitles
      description: "Supply a staged SRT or ASS file, or timed words for karaoke captions. Choose burn-in for visible pixels or embed for a selectable subtitle track."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoSubtitlesRequest" }
            example:
              file_path: "uploads/clip.mp4"
              subtitle_path: "uploads/captions.srt"
              mode: "burn"
              output_path: "out/captioned.mp4"
      responses:
        "200":
          description: Output written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/overlay:
    post:
      tags: [Video Transform]
      summary: "Overlay an image or text"
      operationId: postVideoOverlay
      description: "Place a staged image or a text label at the requested pixel coordinates during a time interval."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoOverlayRequest" }
            example:
              file_path: "uploads/clip.mp4"
              text: "Preview"
              start_sec: 0
              end_sec: 3
              output_path: "out/labeled.mp4"
      responses:
        "200":
          description: Output written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/crop:
    post:
      tags: [Video Transform]
      summary: "Crop a video or fit a canvas"
      operationId: postVideoCrop
      description: "Choose a target size in pixels. Crop the source, add letterboxing, or fill the unused canvas with a blurred background."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoCropRequest" }
            example:
              file_path: "uploads/clip.mp4"
              width: 1080
              height: 1920
              mode: "blur"
              output_path: "out/vertical.mp4"
      responses:
        "200":
          description: Output written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/compose:
    post:
      tags: [Video Transform]
      summary: "Compose a two-clip layout"
      operationId: postVideoCompose
      description: "Place a second staged clip beside, above or inside the first clip. Select which input supplies the audio."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoComposeRequest" }
            example:
              file_path: "uploads/first.mp4"
              second_path: "uploads/second.mp4"
              layout: "horizontal"
              audio: "first"
              output_path: "out/side-by-side.mp4"
      responses:
        "200":
          description: Output written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/scenes:
    post:
      tags: [Video Transform]
      summary: "Detect scene cuts"
      operationId: postVideoScenes
      description: "Write a JSON manifest of detected scenes. Request preview frames or trimmed clips to package the manifest and artifacts together in a ZIP."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoScenesRequest" }
            example:
              file_path: "uploads/clip.mp4"
              artifacts: "frames"
              output_path: "out/scenes.zip"
      responses:
        "200":
          description: Output written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/analyze:
    post:
      tags: [Video Transform]
      summary: "Detect black, frozen or silent intervals"
      operationId: postVideoAnalyze
      description: "Scan a clip for black frames, frozen video and quiet audio. Set the minimum durations and silence threshold to control which intervals are reported."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoAnalyzeRequest" }
            example:
              file_path: "uploads/clip.mp4"
              output_path: "out/analysis.json"
      responses:
        "200":
          description: Output written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/frames:
    post:
      tags: [Video Transform]
      summary: "Extract sampled video frames"
      operationId: postVideoFrames
      description: "Sample frames at the requested time interval. The ZIP contains JPEG files and a manifest with their timestamps."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoFramesRequest" }
            example:
              file_path: "uploads/clip.mp4"
              sample_interval_sec: 2
              max_frames: 20
              output_path: "out/frames.zip"
      responses:
        "200":
          description: Output written.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "422": { $ref: "#/components/responses/422" }

  /v1/video/info:
    post:
      tags: [Info]
      summary: "Read video metadata"
      operationId: postVideoInfo
      description: "Probe the source for duration, dimensions, frame rate, codecs and bitrate without producing a new video."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoInfoRequest" }
            example:
              file_path: "uploads/clip.mp4"
      responses:
        "200":
          description: ffprobe metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoInfoResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
